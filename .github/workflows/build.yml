name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "engine/README.md"
      - "models/README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TRANSCRIBE_CPP_REF: v0.2.3
  VULKAN_VERSION: "1.4.350.0"
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-9.0.zip

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Speak2Text
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Speak2Text
        run: dotnet restore src/Speak2Text/Speak2Text.csproj

      - name: Build Speak2Text
        run: dotnet build src/Speak2Text/Speak2Text.csproj -c Release --no-restore

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          curl.exe -L --fail --retry 3 -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installer failed with exit code $LASTEXITCODE"
          }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Install CUDA Toolkit 12.9
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.0"
          method: network
          use-github-cache: false
          use-local-cache: false
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Build transcribe.cpp CLI (CPU + Vulkan + CUDA)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Keep these paths short: ggml-vulkan / ggml-cuda generate deep paths on Windows.
          $src = "C:\tc"
          $build = "C:\tb"

          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          if (Test-Path $build) { Remove-Item $build -Recurse -Force }

          git clone --depth 1 --branch $env:TRANSCRIBE_CPP_REF https://github.com/handy-computer/transcribe.cpp $src
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone transcribe.cpp" }

          python scripts/patch-transcribe-progress.py $src
          if ($LASTEXITCODE -ne 0) { throw "Failed to patch MOSS realtime progress support" }

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Ninja" }
          }

          cmake -S $src -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTRANSCRIBE_VULKAN=ON `
            -DTRANSCRIBE_CUDA=ON `
            "-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;86-virtual" `
            -DTRANSCRIBE_BUILD_TESTS=OFF `
            -DTRANSCRIBE_BUILD_EXAMPLES=ON `
            -DTRANSCRIBE_BUILD_TOOLS=OFF `
            -DTRANSCRIBE_USE_OPENMP=OFF

          if ($LASTEXITCODE -ne 0) { throw "transcribe.cpp configure failed" }

          cmake --build $build --target transcribe-cli --parallel
          if ($LASTEXITCODE -ne 0) { throw "transcribe-cli build failed" }

          $cli = Get-ChildItem $build -Recurse -File -Filter "transcribe-cli.exe" |
            Select-Object -First 1

          if (-not $cli) {
            throw "transcribe-cli.exe was not produced under $build"
          }

          New-Item -ItemType Directory -Force -Path "engine" | Out-Null

          # The real engine carries all compute backends. A tiny dispatcher keeps
          # MainForm's existing auto/cpu/vulkan contract and can turn only the
          # explicit NVIDIA option into --backend cuda.
          Copy-Item $cli.FullName "engine\transcribe-native.exe" -Force

          cl.exe /nologo /O2 /EHsc /std:c++17 `
            /Fe:"engine\transcribe-cli.exe" `
            "native\transcribe-dispatcher.cpp"
          if ($LASTEXITCODE -ne 0) { throw "dispatcher build failed" }

          # Keep the package portable: CUDA Toolkit is not required on the target PC.
          # The NVIDIA display driver still supplies nvcuda.dll.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $cudaRuntimePatterns = @(
            "cudart64_12.dll",
            "cublas64_12.dll",
            "cublasLt64_12.dll"
          )

          foreach ($pattern in $cudaRuntimePatterns) {
            $dll = Get-ChildItem $cudaBin -File -Filter $pattern | Select-Object -First 1
            if (-not $dll) {
              throw "Required CUDA runtime DLL not found: $pattern under $cudaBin"
            }
            Copy-Item $dll.FullName "engine\$($dll.Name)" -Force
          }

          & "engine\transcribe-cli.exe" --help | Select-String -Pattern "backend" -Context 0,1
          & "engine\transcribe-cli.exe" --list-devices

      - name: Download portable FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"

          curl.exe -L --fail --retry 3 -o $archive $env:FFMPEG_URL
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg download failed" }

          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem $extract -Recurse -File -Filter "ffmpeg.exe" |
            Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Recurse -File -Filter "ffprobe.exe" |
            Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe) {
            throw "ffmpeg.exe or ffprobe.exe was not found in downloaded archive"
          }

          New-Item -ItemType Directory -Force -Path "engine" | Out-Null
          Copy-Item $ffmpeg.FullName "engine\ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "engine\ffprobe.exe" -Force

          & "engine\ffmpeg.exe" -version | Select-Object -First 3
          & "engine\ffprobe.exe" -version | Select-Object -First 1

      - name: Publish complete portable package
        shell: pwsh
        run: ./scripts/publish-portable.ps1 -IncludeRuntimeFiles

      - name: Verify portable package contents
        shell: pwsh
        run: |
          $root = "dist\Speak2Text-win-x64"
          $required = @(
            "$root\Speak2Text.exe",
            "$root\engine\ffmpeg.exe",
            "$root\engine\ffprobe.exe",
            "$root\engine\transcribe-cli.exe",
            "$root\engine\transcribe-native.exe",
            "$root\engine\cudart64_12.dll",
            "$root\engine\cublas64_12.dll",
            "$root\engine\cublasLt64_12.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Portable package is missing: $file"
            }
          }

          Write-Host "Portable package verified."
          Get-ChildItem $root -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speak2Text-win-x64
          path: dist/Speak2Text-win-x64.zip
          if-no-files-found: error
          retention-days: 30
