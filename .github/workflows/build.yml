name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Speak2Text/Speak2Text.csproj

      - name: Build
        run: dotnet build src/Speak2Text/Speak2Text.csproj -c Release --no-restore

      - name: Publish portable front-end
        shell: pwsh
        run: ./scripts/publish-portable.ps1

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speak2Text-win-x64
          path: dist/Speak2Text-win-x64.zip
